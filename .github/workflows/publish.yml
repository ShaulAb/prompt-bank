name: Publish to Marketplaces

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prompt-bank-marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check each marketplace for this version
        id: check_version
        run: node scripts/marketplace-status.cjs
      - name: Verify source matches the tested release tag
        if: steps.check_version.outputs.SHOULD_PUBLISH == 'true'
        run: node scripts/release-source.cjs
      - name: Run quality checks
        if: steps.check_version.outputs.SHOULD_PUBLISH == 'true'
        run: |
          npm run test:release
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build
      - name: Download tested release package
        if: steps.check_version.outputs.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          gh release download "v$VERSION" --pattern "prompt-bank-$VERSION.vsix" --dir release-package
          unzip -p "release-package/prompt-bank-$VERSION.vsix" extension/package.json > release-package/manifest.json
          node -e "const p=require('./package.json'),r=require('./release-package/manifest.json'); if(p.name!==r.name||p.publisher!==r.publisher||p.version!==r.version) throw Error('Release package identity mismatch')"
      - name: Publish to VS Code Marketplace
        if: steps.check_version.outputs.VSCODE_PUBLISHED == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
        run: npx @vscode/vsce publish --packagePath release-package/*.vsix --pat "$VSCE_PAT"
      - name: Publish to Open VSX Registry
        if: steps.check_version.outputs.OPENVSX_PUBLISHED == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
        run: npx ovsx publish release-package/*.vsix --pat "$OVSX_PAT"
      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cat > release-notes.md <<EOF
          ## Release v$VERSION

          Published to [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=prestissimo.prompt-bank) and [Open VSX](https://open-vsx.org/extension/prestissimo/prompt-bank). The tested VSIX is available in the assets below and can also be installed manually in VS Code.

          See [CHANGELOG.md](https://github.com/ShaulAb/prompt-bank/blob/main/CHANGELOG.md) for changes.
          EOF
          gh release edit "v$VERSION" --notes-file release-notes.md
      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          VSCODE_PUBLISHED: ${{ steps.check_version.outputs.VSCODE_PUBLISHED }}
          OPENVSX_PUBLISHED: ${{ steps.check_version.outputs.OPENVSX_PUBLISHED }}
        run: |
          echo "## v$VERSION available on VS Code Marketplace, Open VSX and GitHub Releases" >> "$GITHUB_STEP_SUMMARY"
          for registry in "VS Code Marketplace:$VSCODE_PUBLISHED" "Open VSX:$OPENVSX_PUBLISHED"; do
            if [ "${registry##*:}" = "true" ]; then
              echo "- ${registry%:*}: already published, skipped" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ${registry%:*}: published the tested release VSIX" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
