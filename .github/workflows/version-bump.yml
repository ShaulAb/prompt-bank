name: Version Bump and Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type (existing resumes the version already on dev)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - existing

permissions:
  contents: write

concurrency:
  group: prompt-bank-release
  cancel-in-progress: false

jobs:
  release:
    name: Create Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run from dev branch to ensure all features are merged
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for changelog generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all quality checks
        run: |
          node --test scripts/release-tag.test.cjs
          npx tsc --noEmit
          npm run lint
          npm test
          npm run build

      - name: Configure git identity
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version and generate changelog
        id: version
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
        run: |
          echo "OLD_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

          if [ "$VERSION_TYPE" = "auto" ]; then
            echo "Running automatic version detection based on commits..."
            npm run release
          elif [ "$VERSION_TYPE" = "existing" ]; then
            echo "Resuming the existing version without a bump."
          else
            case "$VERSION_TYPE" in
              patch|minor|major) npm run "release:$VERSION_TYPE" ;;
              *) echo "Unsupported version type"; exit 1 ;;
            esac
          fi

          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          node scripts/release-tag.cjs

      - name: Package extension
        run: npm run package

      - name: Retain VSIX artifact before publishing
        uses: actions/upload-artifact@v4
        with:
          name: prompt-bank-${{ steps.version.outputs.NEW_VERSION }}
          path: prompt-bank-${{ steps.version.outputs.NEW_VERSION }}.vsix
          if-no-files-found: error
          retention-days: 30

      - name: Push changes to dev
        env:
          VERSION: ${{ steps.version.outputs.NEW_VERSION }}
        run: |
          git push --atomic origin HEAD:refs/heads/dev "refs/tags/v$VERSION:refs/tags/v$VERSION"

      - name: Create release and attach VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.NEW_VERSION }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/releases" --paginate --jq '.[].tag_name' > release-tags.txt
          if ! grep -Fxq "v$VERSION" release-tags.txt; then
            cat > release-notes.md <<EOF
          ## Manual testing required
          Download and install prompt-bank-$VERSION.vsix, then verify authentication and sync.
          After testing, promote dev to main for automated marketplace publishing.
          See CHANGELOG.md for the included changes.
          EOF
            gh release create "v$VERSION" --verify-tag --title "Release v$VERSION" --notes-file release-notes.md
          fi
          gh release upload "v$VERSION" "prompt-bank-$VERSION.vsix" --clobber

      - name: Summary
        run: |
          echo "## 🚀 Release v${{ steps.version.outputs.NEW_VERSION }} Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Old Version:** v${{ steps.version.outputs.OLD_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New Version:** v${{ steps.version.outputs.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Type:** ${{ github.event.inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ What was created:" >> $GITHUB_STEP_SUMMARY
          echo "- Version bump and changelog pushed to dev branch" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub release with VSIX package ready for testing" >> $GITHUB_STEP_SUMMARY
          echo "- Git tag v${{ steps.version.outputs.NEW_VERSION }} created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Next steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download and test the VSIX package locally" >> $GITHUB_STEP_SUMMARY
          echo "2. If testing passes, merge dev → main" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify the automated marketplace publishing workflow" >> $GITHUB_STEP_SUMMARY
